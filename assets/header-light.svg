<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Carson, independent developer</title>
  <desc id="desc">A light banner blending connected software nodes with a musical staff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="0.52" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <circle cx="80" cy="52" r="72" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1120" cy="210" r="94" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>

  <g fill="none" stroke="#6366f1" stroke-width="2" opacity="0.24">
    <path d="M38 184 C112 184 92 76 176 76 S246 148 322 148"/>
    <path d="M58 212 C126 212 142 132 214 132 S286 58 350 58"/>
  </g>
  <g fill="#ffffff" stroke="#6366f1" stroke-width="3">
    <circle cx="38" cy="184" r="7"/>
    <circle cx="176" cy="76" r="7"/>
    <circle cx="322" cy="148" r="7"/>
    <circle cx="58" cy="212" r="7"/>
    <circle cx="214" cy="132" r="7"/>
    <circle cx="350" cy="58" r="7"/>
  </g>

  <text x="600" y="122" text-anchor="middle" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="720" letter-spacing="8">CARSON</text>
  <rect x="470" y="146" width="260" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="600" y="184" text-anchor="middle" fill="#4b5563" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="3">INDEPENDENT DEVELOPER</text>

  <g fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.24">
    <path d="M850 82 H1160"/>
    <path d="M850 98 H1160"/>
    <path d="M850 114 H1160"/>
    <path d="M850 130 H1160"/>
    <path d="M850 146 H1160"/>
  </g>
  <g fill="#0891b2" opacity="0.5">
    <ellipse cx="930" cy="130" rx="10" ry="7" transform="rotate(-16 930 130)"/>
    <rect x="938" y="76" width="3" height="54" rx="1.5"/>
    <ellipse cx="1024" cy="109" rx="10" ry="7" transform="rotate(-16 1024 109)"/>
    <rect x="1032" y="60" width="3" height="49" rx="1.5"/>
    <ellipse cx="1104" cy="146" rx="10" ry="7" transform="rotate(-16 1104 146)"/>
    <rect x="1112" y="91" width="3" height="55" rx="1.5"/>
  </g>
</svg>
